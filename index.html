<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כרטיס ביקור | רומי שושני</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="main-content">
        <section class="hero" id="home" aria-labelledby="profile-name">
            <div class="hero-content">
                <p class="eyebrow">DIGITAL BUSINESS CARD</p>
                <h1 class="full-name" id="profile-name">רומי שושני</h1>
                <p class="job-title">מפתחת DevOps</p>
                <div class="hero-actions">
                    <a class="button button-primary" href="#contact">ליצירת קשר</a>
                    <a class="button button-secondary" href="#projects">לפרויקטים שלי</a>
                </div>
            </div>

            <figure class="profile-visual">
                <img
                    class="profile-image"
                    src="profile-image.jpg"
                    alt="תמונת פרופיל"
                >
            </figure>
        </section>
    </main>
</body>
</html>
